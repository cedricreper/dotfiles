unbind = SUPER, L

# Remap close window from SUPER+W to SUPER+Q
unbind = SUPER, W
bindd = SUPER, Q, Close window, killactive,
# capslock as ctrl
input {
    kb_options = ctrl:nocaps
}
# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"

# Add extra bindings
# bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
# bindd = SUPER SHIFT, R, exec, alacritty -e ssh your-server

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu
# Map F-keys to brightness/volume since hardware sends F1/F2/etc.
# Brightness
binde = , F1, exec, brightnessctl set 5%-
binde = , F2, exec, brightnessctl set +5%

# Volume
binde = , F11, exec, pamixer -d 5
binde = , F12, exec, pamixer -i 5
binde = , F10, exec, pamixer -t          # mute — adjust F-key to match your keyboard

# Media
bind = , F7, exec, playerctl previous
bind = , F8, exec, playerctl play-pause
bind = , F9, exec, playerctl next

bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d
